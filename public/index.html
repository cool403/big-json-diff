<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>big-json-diff · 超大 JSON 对比</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #11151f;
    --panel: #151a26;
    --panel-2: #1a2030;
    --border: #232b3d;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #6c8cff;
    --added: #34d399;
    --removed: #f87171;
    --changed: #fbbf24;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #131825, #0e1220);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #6c8cff, #a06cff);
    display: grid; place-items: center; font-size: 17px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 14px rgba(108,140,255,.35);
  }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--text-dim); font-size: 12px; margin-left: 2px; }
  header .duck {
    margin-left: auto; font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
    background: var(--panel);
  }

  .upload-area {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch;
    padding: 20px 24px;
  }
  .drop {
    border: 1.5px dashed var(--border); border-radius: 14px;
    background: var(--panel);
    padding: 22px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s, transform .15s;
    position: relative; min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop:hover { border-color: var(--accent); background: var(--panel-2); }
  .drop.drag { border-color: var(--accent); background: rgba(108,140,255,.08); transform: scale(1.01); }
  .drop .icon { font-size: 26px; opacity: .8; }
  .drop .label { font-size: 14px; font-weight: 600; }
  .drop .hint { font-size: 12px; color: var(--text-dim); }
  .drop .file { display: none; align-items: center; gap: 10px; width: 100%; }
  .drop.loaded { border-style: solid; border-color: var(--added); }
  .drop.loaded .file { display: flex; }
  .drop.loaded .empty { display: none; }
  .file .fname {
    font-family: var(--mono); font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 60%;
  }
  .file .fsize { color: var(--text-dim); font-size: 12px; }
  .file .badge {
    margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(52,211,153,.12); color: var(--added); border: 1px solid rgba(52,211,153,.3);
    white-space: nowrap; flex-shrink: 0;
  }
  .file .re { color: var(--accent); font-size: 11px; text-decoration: underline; cursor: pointer; white-space: nowrap; flex-shrink: 0; position: relative; z-index: 2; }

  .drop.uploading { border-color: var(--accent); }
  .drop .progress { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--bg-soft); border-radius: 0 0 11px 11px; overflow: hidden; z-index: 2; }
  .drop.uploading .progress { display: block; }
  .drop .progress i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .12s; }

  .paste-link { color: var(--accent); text-decoration: underline; cursor: pointer; position: relative; z-index: 2; }
  .pastebox { display: none; width: 100%; flex-direction: column; gap: 8px; position: relative; z-index: 2; }
  .drop.pasting .pastebox { display: flex; }
  .drop.pasting .empty { display: none; }
  .drop.pasting input[type=file] { display: none; }
  .pastebox textarea {
    width: 100%; height: 150px; resize: vertical;
    background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px; font-family: var(--mono); font-size: 12px; outline: none;
  }
  .pastebox textarea:focus { border-color: var(--accent); }
  .pastebox .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .pastebox button {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 12.5px; padding: 6px 16px; border-radius: 8px; cursor: pointer;
  }
  .pastebox button.primary { background: linear-gradient(135deg, #6c8cff, #a06cff); border: none; font-weight: 600; }

  .vs { display: grid; place-items: center; color: var(--text-dim); font-weight: 700; font-size: 13px; }
  .vs span {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--border);
  }

  .controls { display: flex; align-items: center; gap: 14px; padding: 0 24px 16px; }
  #compareBtn {
    background: linear-gradient(135deg, #6c8cff, #a06cff);
    color: #fff; border: none; padding: 10px 34px; font-size: 14px; font-weight: 650;
    border-radius: 10px; cursor: pointer; letter-spacing: .3px;
    box-shadow: 0 4px 16px rgba(108,140,255,.35);
    transition: opacity .2s, transform .1s;
  }
  #compareBtn:hover:not(:disabled) { transform: translateY(-1px); }
  #compareBtn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  #status { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite; display: none;
  }
  .spinner.on { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary { display: none; gap: 12px; padding: 0 24px 14px; }
  .summary.show { display: grid; grid-template-columns: repeat(4, 1fr); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px;
  }
  .card .num { font-size: 24px; font-weight: 750; font-family: var(--mono); }
  .card .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .card.total .num { color: var(--accent); }
  .card.added .num { color: var(--added); }
  .card.removed .num { color: var(--removed); }
  .card.changed .num { color: var(--changed); }

  .toolbar { display: none; align-items: center; gap: 10px; padding: 0 24px 12px; }
  .toolbar.show { display: flex; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .tab {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 12.5px; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  }
  .tab.active { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .tab .c { font-family: var(--mono); font-size: 11px; opacity: .75; margin-left: 4px; }
  #search {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 13px; padding: 8px 12px; outline: none;
    font-family: var(--mono);
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }

  .list-wrap { flex: 1; overflow: hidden; padding: 0 24px 20px; display: none; }
  .list-wrap.show { display: block; }
  #list {
    height: 100%; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 12px; background: var(--bg-soft);
  }
  /* ---- grouped diff view ---- */
  .group { border-bottom: 1px solid rgba(35,43,61,.6); }
  .group > summary {
    display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none;
    padding: 8px 14px; user-select: none;
    position: sticky; top: 0; z-index: 3;
    background: var(--panel);
    border-left: 3px solid var(--border);
    font-family: var(--mono); font-size: 12.5px;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: '▸'; color: var(--text-dim); font-size: 11px; transition: transform .15s;
  }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group > summary:hover { background: var(--panel-2); }
  .group .gpath { color: #9db4ff; font-weight: 600; word-break: break-all; }
  .group .gbadges { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .group .gbadges i {
    font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
  }
  .gbadges .ba { color: var(--added); background: rgba(52,211,153,.12); }
  .gbadges .br { color: var(--removed); background: rgba(248,113,113,.12); }
  .gbadges .bc { color: var(--changed); background: rgba(251,191,36,.12); }

  .drow {
    display: grid; grid-template-columns: minmax(140px, 220px) 1fr 1fr;
    border-top: 1px solid rgba(35,43,61,.45);
    font-family: var(--mono); font-size: 12.5px;
    border-left: 3px solid transparent;
  }
  .drow:hover { background: rgba(108,140,255,.05); }
  .drow.added { border-left-color: var(--added); }
  .drow.removed { border-left-color: var(--removed); }
  .drow.changed { border-left-color: var(--changed); }
  .drow .leaf {
    padding: 9px 12px; color: var(--text); font-weight: 600; word-break: break-all;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .drow .leaf .k {
    font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: .4px; margin-top: 1px;
  }
  .drow .leaf .k.added { color: var(--added); background: rgba(52,211,153,.14); }
  .drow .leaf .k.removed { color: var(--removed); background: rgba(248,113,113,.14); }
  .drow .leaf .k.changed { color: var(--changed); background: rgba(251,191,36,.14); }
  .drow .vcol { padding: 8px 12px; min-width: 0; border-left: 1px dashed rgba(35,43,61,.8); }
  .drow .vcol.span2 { grid-column: span 2; }
  .drow .vlabel {
    display: inline-block; font-size: 10px; font-weight: 800; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-right: 6px;
  }
  .drow .vcol.a .vlabel { color: var(--removed); border-color: rgba(248,113,113,.4); }
  .drow .vcol.b .vlabel { color: var(--added); border-color: rgba(52,211,153,.4); }
  .drow .v { word-break: break-all; white-space: pre-wrap; }
  .drow .vcol.a .v { color: #fca5a5; }
  .drow .vcol.b .v { color: #6ee7b7; }
  .drow .v.clamp { max-height: 96px; overflow: hidden; position: relative; cursor: pointer; }
  .drow .v.clamp::after {
    content: '点击展开'; position: absolute; inset: auto 0 0 0; text-align: center;
    font-size: 10px; color: var(--accent); padding-top: 24px;
    background: linear-gradient(transparent, var(--bg-soft) 75%);
  }
  .empty-state { padding: 40px; text-align: center; color: var(--text-dim); font-size: 13px; }

  #list::-webkit-scrollbar { width: 10px; }
  #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #2a1215; border: 1px solid rgba(248,113,113,.4); color: #fca5a5;
    padding: 10px 20px; border-radius: 10px; font-size: 13px;
    transition: transform .25s; z-index: 50; max-width: 70vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <div class="logo">⇄</div>
    <h1>big-json-diff</h1>
    <span class="sub">超大 JSON 文件可视化对比</span>
    <span class="duck">🦆 powered by DuckDB</span>
  </header>

  <div class="upload-area">
    <div class="drop" id="dropA">
      <div class="empty">
        <div class="icon">📄</div>
        <div class="label">基准 JSON（A）</div>
        <div class="hint">拖拽文件到此处，或点击选择 · <span class="paste-link">粘贴文本</span></div>
      </div>
      <div class="pastebox">
        <textarea placeholder='粘贴 JSON 内容，例如 {"a": 1}' spellcheck="false"></textarea>
        <div class="actions">
          <button class="cancel">取消</button>
          <button class="primary">上传</button>
        </div>
      </div>
      <div class="file">
        <span>📄</span><span class="fname"></span><span class="fsize"></span>
        <span class="badge">已上传</span><span class="re">重新选择</span>
      </div>
      <div class="progress"><i></i></div>
      <input type="file" accept=".json,application/json" />
    </div>
    <div class="vs"><span>VS</span></div>
    <div class="drop" id="dropB">
      <div class="empty">
        <div class="icon">📄</div>
        <div class="label">对比 JSON（B）</div>
        <div class="hint">拖拽文件到此处，或点击选择 · <span class="paste-link">粘贴文本</span></div>
      </div>
      <div class="pastebox">
        <textarea placeholder='粘贴 JSON 内容，例如 {"a": 1}' spellcheck="false"></textarea>
        <div class="actions">
          <button class="cancel">取消</button>
          <button class="primary">上传</button>
        </div>
      </div>
      <div class="file">
        <span>📄</span><span class="fname"></span><span class="fsize"></span>
        <span class="badge">已上传</span><span class="re">重新选择</span>
      </div>
      <div class="progress"><i></i></div>
      <input type="file" accept=".json,application/json" />
    </div>
  </div>

  <div class="controls">
    <button id="compareBtn" disabled>开始对比</button>
    <div id="status"><span class="spinner" id="spinner"></span><span id="statusText">请上传两个 JSON 文件</span></div>
  </div>

  <div class="summary" id="summary">
    <div class="card total"><div class="num" id="cTotal">0</div><div class="lbl">总差异</div></div>
    <div class="card added"><div class="num" id="cAdded">0</div><div class="lbl">新增（B 多出）</div></div>
    <div class="card removed"><div class="num" id="cRemoved">0</div><div class="lbl">删除（A 有 B 无）</div></div>
    <div class="card changed"><div class="num" id="cChanged">0</div><div class="lbl">值变更</div></div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="tabs">
      <button class="tab active" data-f="all">全部<span class="c" id="tAll"></span></button>
      <button class="tab" data-f="added">新增<span class="c" id="tAdded"></span></button>
      <button class="tab" data-f="removed">删除<span class="c" id="tRemoved"></span></button>
      <button class="tab" data-f="changed">变更<span class="c" id="tChanged"></span></button>
    </div>
    <input id="search" placeholder="按路径过滤，如 $.users[0] 或 .name" />
  </div>

  <div class="list-wrap" id="listWrap">
    <div id="list"><div class="empty-state">差异结果将实时显示在这里</div></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    uploads: { a: null, b: null },
    rows: [],          // all streamed diff rows
    filtered: [],
    filter: 'all',
    search: '',
    rendered: 0,
    done: false,
  };
  // minimal debug/test handle
  window.__bjd = state;

  const fmtSize = (n) => {
    if (n < 1024) return n + ' B';
    if (n < 1024 ** 2) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 ** 3) return (n / 1024 ** 2).toFixed(2) + ' MB';
    return (n / 1024 ** 3).toFixed(2) + ' GB';
  };
  const fmtNum = (n) => n.toLocaleString('en-US');

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function setStatus(text, busy) {
    $('statusText').textContent = text;
    $('spinner').classList.toggle('on', !!busy);
  }

  function refreshBtn() {
    $('compareBtn').disabled = !(state.uploads.a && state.uploads.b);
    if (state.uploads.a && state.uploads.b && !state.done) setStatus('就绪，点击开始对比', false);
  }

  // ---------- upload ----------
  function setupDrop(el, side) {
    const input = el.querySelector('input[type=file]');
    // "重新选择": back to the default state (upload + paste), do NOT open the file dialog
    el.querySelector('.re').addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('loaded');
      state.uploads[side] = null;
      refreshBtn();
      setStatus('已移除 ' + side + ' 侧文件');
    });
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag'));
    el.addEventListener('drop', (e) => {
      e.preventDefault(); el.classList.remove('drag');
      if (e.dataTransfer.files[0]) upload(side, e.dataTransfer.files[0], el);
    });
    input.addEventListener('change', () => {
      if (input.files[0]) upload(side, input.files[0], el);
      input.value = '';
    });

    // paste-as-text mode
    const box = el.querySelector('.pastebox');
    const ta = box.querySelector('textarea');
    el.querySelector('.paste-link').addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      el.classList.add('pasting');
      ta.focus();
    });
    box.querySelector('.cancel').addEventListener('click', () => {
      el.classList.remove('pasting');
      ta.value = '';
    });
    box.querySelector('.primary').addEventListener('click', () => {
      const text = ta.value.trim();
      if (!text) { toast('请先粘贴 JSON 内容'); return; }
      try { JSON.parse(text); } catch (e) { toast('JSON 格式不正确：' + e.message); return; }
      el.classList.remove('pasting');
      const file = new File([text], `pasted-${side}.json`, { type: 'application/json' });
      ta.value = '';
      upload(side, file, el);
    });
  }

  function upload(side, file, el) {
    setStatus(`正在上传 ${file.name}（${fmtSize(file.size)}）…`, true);
    const bar = el.querySelector('.progress i');
    el.classList.add('uploading');
    bar.style.width = '0%';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload?name=' + encodeURIComponent(file.name));
    xhr.setRequestHeader('content-type', 'application/octet-stream');
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      bar.style.width = pct + '%';
      setStatus(`正在上传 ${file.name}（${fmtSize(file.size)}）… ${pct}%`, true);
    };
    const done = () => { el.classList.remove('uploading'); bar.style.width = '0%'; };
    xhr.onload = () => {
      done();
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch { /* ignore */ }
      if (xhr.status !== 200) {
        setStatus('上传失败', false);
        toast('上传失败：' + (data.error || xhr.statusText));
        return;
      }
      state.uploads[side] = data;
      el.classList.add('loaded');
      el.querySelector('.fname').textContent = data.name;
      el.querySelector('.fsize').textContent = fmtSize(data.size);
      setStatus(`${data.name}（${fmtSize(data.size)}）上传完成`);
      refreshBtn();
    };
    xhr.onerror = () => { done(); setStatus('上传失败', false); toast('上传失败：网络错误'); };
    xhr.send(file);
  }

  setupDrop($('dropA'), 'a');
  setupDrop($('dropB'), 'b');

  // ---------- websocket ----------
  let ws = null;
  function connect() {
    return new Promise((resolve, reject) => {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = resolve;
      ws.onerror = () => reject(new Error('WebSocket 连接失败'));
    });
  }

  $('compareBtn').addEventListener('click', async () => {
    // reset view
    state.rows = []; state.filtered = []; state.rendered = 0; state.done = false;
    $('list').innerHTML = '';
    $('summary').classList.remove('show');
    $('toolbar').classList.remove('show');
    $('listWrap').classList.remove('show');
    $('compareBtn').disabled = true;
    setStatus('连接中…', true);

    try {
      await connect();
    } catch (e) {
      toast(e.message); setStatus('连接失败', false); refreshBtn(); return;
    }

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      switch (msg.type) {
        case 'status':
          setStatus(msg.detail || msg.stage, true);
          break;
        case 'summary': {
          const s = msg.summary;
          $('cTotal').textContent = fmtNum(s.added + s.removed + s.changed);
          $('cAdded').textContent = fmtNum(s.added);
          $('cRemoved').textContent = fmtNum(s.removed);
          $('cChanged').textContent = fmtNum(s.changed);
          $('tAll').textContent = fmtNum(s.added + s.removed + s.changed);
          $('tAdded').textContent = fmtNum(s.added);
          $('tRemoved').textContent = fmtNum(s.removed);
          $('tChanged').textContent = fmtNum(s.changed);
          $('summary').classList.add('show');
          $('toolbar').classList.add('show');
          $('listWrap').classList.add('show');
          setStatus(`对比完成，正在渲染差异…（A: ${fmtNum(msg.stats.aLeaves)} 叶子节点，B: ${fmtNum(msg.stats.bLeaves)}）`, true);
          break;
        }
        case 'batch':
          state.rows.push(...msg.rows);
          applyFilter();
          break;
        case 'done':
          state.done = true;
          setStatus(`完成，共 ${fmtNum(state.rows.length)} 处差异`, false);
          if (state.rows.length === 0) {
            $('list').innerHTML = '<div class="empty-state">🎉 两个 JSON 完全一致，没有差异</div>';
          }
          renderMore();
          refreshBtn();
          break;
        case 'error':
          toast('对比出错：' + msg.message);
          setStatus('出错：' + msg.message, false);
          refreshBtn();
          break;
      }
    };
    ws.onclose = () => { if (!state.done) { setStatus('连接已断开', false); refreshBtn(); } };

    ws.send(JSON.stringify({ type: 'compare', a: state.uploads.a.id, b: state.uploads.b.id }));
  });

  // ---------- filter / search ----------
  function applyFilter() {
    const q = state.search.toLowerCase();
    state.filtered = state.rows.filter((r) =>
      (state.filter === 'all' || r.kind === state.filter) &&
      (!q || r.path.toLowerCase().includes(q))
    );
    state.groups = buildGroups(state.filtered);
    state.rendered = 0;
    $('list').innerHTML = '';
    renderMore();
  }

  document.querySelectorAll('.tab').forEach((t) =>
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      state.filter = t.dataset.f;
      applyFilter();
    })
  );

  let searchTimer = null;
  $('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = e.target.value.trim(); applyFilter(); }, 200);
  });

  // ---------- grouped rendering ----------
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KIND_LABEL = { added: '新增', removed: '删除', changed: '变更' };

  /** Split a leaf path into (parent, leaf): "$.users[1].name" -> ("$.users[1]", "name") */
  function splitPath(p) {
    const m = p.match(/(\.[^.\[\]]+|\[\d+\])$/);
    if (!m) return { parent: '$', leaf: p.replace(/^\$\.?/, '') || '$' };
    const parent = p.slice(0, p.length - m[1].length) || '$';
    return { parent, leaf: m[1].replace(/^\./, '') };
  }

  function buildGroups(rows) {
    const groups = [];
    const map = new Map();
    for (const r of rows) {
      const { parent, leaf } = splitPath(r.path);
      let g = map.get(parent);
      if (!g) {
        g = { parent, rows: [], added: 0, removed: 0, changed: 0 };
        map.set(parent, g);
        groups.push(g);
      }
      g.rows.push({ leaf, kind: r.kind, a: r.a, b: r.b });
      g[r.kind]++;
    }
    return groups;
  }

  function valCol(cls, label, v, span) {
    const clamp = (v || '').length > 200 ? ' clamp' : '';
    return `<div class="vcol ${cls}${span ? ' span2' : ''}"><span class="vlabel">${label}</span><span class="v${clamp}">${esc(v ?? 'null')}</span></div>`;
  }

  function drowHtml(r) {
    let cols;
    if (r.kind === 'added') cols = valCol('b', 'B', r.b, true);
    else if (r.kind === 'removed') cols = valCol('a', 'A', r.a, true);
    else cols = valCol('a', 'A', r.a, false) + valCol('b', 'B', r.b, false);
    return `<div class="drow ${r.kind}"><div class="leaf"><span class="k ${r.kind}">${KIND_LABEL[r.kind]}</span><span>${esc(r.leaf)}</span></div>${cols}</div>`;
  }

  function groupHtml(g) {
    const badges =
      (g.added ? `<i class="ba">+${g.added}</i>` : '') +
      (g.removed ? `<i class="br">−${g.removed}</i>` : '') +
      (g.changed ? `<i class="bc">~${g.changed}</i>` : '');
    const rows = g.rows.map(drowHtml).join('');
    return `<details class="group" open><summary><span class="gpath">${esc(g.parent)}</span><span class="gbadges">${badges}</span></summary>${rows}</details>`;
  }

  /** Render groups lazily: append groups until we reach ~RENDER_ROWS rows. */
  const RENDER_ROWS = 1500;
  function renderMore() {
    const list = $('list');
    const groups = state.groups || [];
    if (state.rendered >= groups.length) return;
    const sent = list.querySelector('.sentinel');
    if (sent) sent.remove();
    let html = '', rows = 0, i = state.rendered;
    for (; i < groups.length && rows < RENDER_ROWS; i++) {
      html += groupHtml(groups[i]);
      rows += groups[i].rows.length;
    }
    list.insertAdjacentHTML('beforeend', html);
    state.rendered = i;
    const totalRows = state.filtered.length;
    const renderedRows = groups.slice(0, i).reduce((s, g) => s + g.rows.length, 0);
    if (i < groups.length) {
      list.insertAdjacentHTML('beforeend',
        `<div class="empty-state sentinel">已显示 ${fmtNum(renderedRows)} / ${fmtNum(totalRows)} 条（${fmtNum(groups.length)} 个分组），滚动加载更多…</div>`);
    }
  }

  // click to expand clamped long values
  $('list').addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('v') && e.target.classList.contains('clamp')) {
      e.target.classList.remove('clamp');
    }
  });

  $('list').addEventListener('scroll', (e) => {
    const el = e.target;
    if (el.scrollTop + el.clientHeight > el.scrollHeight - 600) renderMore();
  });
})();
</script>
</body>
</html>
